server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Content-hashed bundles can be cached; `expires` alone keeps the headers above inherited.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # SPA routes (/s/<id>, /auth/callback, /vault/*) all fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
