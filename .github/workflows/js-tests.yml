name: js-tests

on:
  push:
    paths:
      - '.github/workflows/js-tests.yml'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
    branches: [ "mainline" ]
  pull_request:
    paths:
      - '.github/workflows/js-tests.yml'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
    branches: [ "mainline" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    steps:

      - name: Checkout code
        uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 17
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Build Smithy model
        working-directory: smithy
        run: ./gradlew smithyBuild

      # Single workspace install — covers @cortex/client, @cortex/encryption, @cortex/web.
      - name: Install dependencies
        run: npm ci

      # Build generated/source packages whose compiled output @cortex/web imports
      # (dist-*/dist), which a fresh `npm ci` does not produce.
      - name: Build client + encryption packages
        run: |
          npm run build:client
          npm run build:encryption

      # Runs test:encryption (jest) then test:web (vitest).
      - name: Run TypeScript/JS unit tests
        run: npm run test:all
