name: js-tests

on:
  push:
    paths:
      - '.github/workflows/js-tests.yml'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
    branches: [ "mainline" ]
  pull_request:
    paths:
      - '.github/workflows/js-tests.yml'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
    branches: [ "mainline" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Single workspace install — covers @cortex/encryption and @cortex/web.
      - name: Install dependencies
        run: npm ci

      # Build @cortex/encryption first: @cortex/web imports its compiled dist
      # (package main: dist/index.js), which a fresh `npm ci` does not produce.
      - name: Build encryption package
        run: npm run build:encryption

      # Runs test:encryption (jest) then test:web (vitest).
      - name: Run TypeScript/JS unit tests
        run: npm run test:all
