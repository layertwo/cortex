name: code-scan

on:
  schedule:
    - cron: "0 0 * * 0" # Every Sunday at midnight
  workflow_dispatch: # Manual trigger option

concurrency:
  group: code-scan
  cancel-in-progress: true

env:
  AWS_REGION: "us-east-1"

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read 
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.BEDROCK_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: anthropics/claude-code-action@v1
        with:
          use_bedrock: true
          claude_args: |
            --model us.anthropic.claude-sonnet-4-5-20250929-v1:0
            --disallowedTools WebSearch
            --allowedTools "mcp__github_create_issue,mcp__github_update_issue,mcp__github_search_issues,mcp__github_list_issues,mcp__github_create_comment,mcp__github_get_issue,mcp__github__list_pull_request_comments,Read"
          prompt: |
            REPO: ${{ github.repository }}

            Perform weekly repository maintenance:

            - Code quality and best practices
            - Potential bugs or issues
            - Security implications
            - Performance considerations
            - Review documentation and AGENTS.md is accurate

            Before creating ANY issues:
            1. FIRST use `mcp__github__list_issues` to fetch ALL existing issues 
            2. Check each existing issue for similar issue description (same security concern, same code smell, etc.)
            3. SKIP posting if an existing issue has already been created
            4. Only post NEW issues that haven't been raised in previous review runs

            If critical security issues are found, also comment on open PRs if relevant.