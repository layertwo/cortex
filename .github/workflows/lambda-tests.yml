name: Lambda Tests

on:
  push:
    paths: ['lambda/**', '.github/workflows/lambda-tests.yml']
    branches: [ "mainline" ]
  pull_request:
    paths: ['lambda/**', '.github/workflows/lambda-tests.yml']
    branches: [ "mainline" ]

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: 'lambda/uv.lock'

      - name: Install dependencies
        working-directory: lambda
        run: uv sync --group dev --python ${{ matrix.python-version }}

      - name: Check code formatting with black
        working-directory: lambda
        run: uv run black --check --diff src/ tests/

      - name: Check import sorting with isort
        working-directory: lambda
        run: uv run isort --check-only --diff src/ tests/

      - name: Run flake8 linting
        working-directory: lambda
        run: uv run flake8 src/ tests/

      - name: Run tests with coverage
        working-directory: lambda
        run: uv run pytest
        env:
          COVERAGE_FILE: .coverage.${{ matrix.python-version }}

      - name: Store coverage file
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: lambda/.coverage.${{ matrix.python-version }}
          include-hidden-files: true

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: test
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
          path: lambda/

      - name: Coverage comment
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@v4.1
        with:
          GITHUB_TOKEN: ${{ github.token }}
          COVERAGE_PATH: lambda/
          MERGE_COVERAGE_FILES: true
