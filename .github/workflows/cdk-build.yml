name: cdk-build

on:
  push:
    paths:
      - '.github/workflows/cdk-build.yml'
      - 'smithy/**'
      - 'lambda/**'
      - 'cdk/**'
      - 'packages/**'
      - 'package.*'
    branches: [ "mainline" ]
  pull_request:
    paths:
      - '.github/workflows/cdk-build.yml'
      - 'smithy/**'
      - 'cdk/**'
    branches: [ "mainline" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 17
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Build Smithy model
        working-directory: smithy
        run: ./gradlew smithyBuild

      - name: Install CDK dependencies
        working-directory: cdk
        run: npm ci

      - name: Build CDK application
        working-directory: cdk
        run: npm run build

      - name: CDK Synthesize
        working-directory: cdk
        run: npx cdk synth
