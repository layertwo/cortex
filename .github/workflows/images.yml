name: images

on:
  workflow_dispatch:
  push:
    branches: [ "mainline" ]
    # Version tags publish vX.Y.Z; path filters do not apply to tags.
    tags: [ "v*" ]
    paths:
      - '.github/workflows/images.yml'
      - 'packages/**'
      - 'lambda/**'
      - 'smithy/**'
      - 'package.json'
      - 'package-lock.json'

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing: Fulcio accepts the workflow's GitHub OIDC token.
      id-token: write

    steps:

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 17
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
          cache-dependency-glob: 'lambda/uv.lock'

      - name: Install Lambda dev dependencies (codegen)
        working-directory: lambda
        run: uv sync --group dev

      # Generates lambda/src/shared/generated/models.py (baked into the API image) and
      # stages the Smithy TS client into packages/client (needed by the web build).
      - name: Generate Smithy artifacts
        run: bash lambda/scripts/codegen.sh

      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      - name: Build client + encryption packages
        run: |
          npm run build:client
          npm run build:encryption

      - name: Build web app
        run: npm run build:web

      # latest only on mainline; every build gets sha-<short>; v* tags also get vX.Y.Z.
      - name: Image metadata (API)
        id: api-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/layertwo/cortex-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern=v{{version}}

      - name: Image metadata (web)
        id: web-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/layertwo/cortex-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern=v{{version}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Log into the registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        id: api
        uses: docker/build-push-action@v7
        with:
          context: lambda
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          cache-from: type=gha,scope=cortex-api
          cache-to: type=gha,mode=max,scope=cortex-api

      # Sign the pushed digest, not a tag, so a moved tag cannot borrow a signature.
      - name: Sign the API image
        run: cosign sign --yes ghcr.io/layertwo/cortex-api@${{ steps.api.outputs.digest }}

      - name: Build and push web image
        id: web
        uses: docker/build-push-action@v7
        with:
          context: packages/web
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          cache-from: type=gha,scope=cortex-web
          cache-to: type=gha,mode=max,scope=cortex-web

      - name: Sign the web image
        run: cosign sign --yes ghcr.io/layertwo/cortex-web@${{ steps.web.outputs.digest }}
